name: Extract and Publish Google TV APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract APK
        run: |
          set -euo pipefail
          mkdir -p extracted-apk
          unzip -q -o Google-TV-Tracker-APK.zip -d extracted-apk
          test -f extracted-apk/app-debug.apk
          ls -l extracted-apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android TV APK ${{ github.run_number }}
          body: |
            Extracted Android TV debug APK.
          files: extracted-apk/app-debug.apk
          fail_on_unmatched_files: true
