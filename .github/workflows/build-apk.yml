name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-node: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Cordova
      run: npm install -g cordova

    - name: Prepare Cordova Project
      run: |
        mkdir cordova-app
        cd cordova-app
        cordova create app com.yourname.tvtracker "Incident Tracker"
        cd app
        cordova platform add android
        rm -rf www/*
        cp ../../index.html www/
        cp ../../config.xml .
        cordova build android --debug -- --packageType=apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Google-TV-Tracker-APK
        path: cordova-app/app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
